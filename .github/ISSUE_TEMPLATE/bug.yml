name: Builder bug
description: Report a reproducible packaging, formatting, validation, or automation problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here. Use the private security-reporting link instead.
  - type: input
    id: source-tag
    attributes:
      label: Upstream source tag
      placeholder: 1.18.6
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Docker or Java version if relevant
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Failing command
      options:
        - make
        - make epub
        - make validate
        - make epubcheck
        - make checksum
        - make test
        - GitHub Actions
        - EPUB reader display
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and reproducible steps.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Validator or command output
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have not included secrets, private data, or an untrusted EPUB attachment.
          required: true
