name: Build EPUB release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild upstream master even when its commit is already published
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: epub-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.upstream.outputs.has_changes }}
      source_commit: ${{ steps.upstream.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Fetch upstream default branch
        run: make fetch

      - name: Check for a new upstream master commit
        id: upstream
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          commit="$(git -C build/upstream rev-parse refs/remotes/origin/master^{commit})"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if test "$FORCE_REBUILD" = true; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif gh release view epub-master --json body --jq .body 2>/dev/null | grep -Fq "Source commit: $commit"; then
            echo "Upstream master commit $commit is already published"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned, hash-verified tools
        if: steps.upstream.outputs.has_changes == 'true'
        run: |
          make dependencies
          ./scripts/install_epubcheck.sh

      - name: Build and validate upstream master
        if: steps.upstream.outputs.has_changes == 'true'
        run: make checksum SOURCE_REF=master

      - name: Upload verified release candidates
        if: steps.upstream.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-epub-releases
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: needs.build.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download verified release candidates
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: verified-epub-releases
          path: dist

      - name: Verify transferred artifacts
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          epub="dist/kubernetes-the-hard-way-master.epub"
          python3 scripts/verify_provenance.py \
            "$epub" "$epub.provenance.json" "$epub.sha256" \
            --ref master --commit "$EXPECTED_SOURCE_COMMIT"

      - name: Attest EPUB provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.epub

      - name: Publish verified artifacts
        env:
          TRADEMARK_URL: https://www.linuxfoundation.org/legal/tm-usage
        run: |
          cd dist
          epub="kubernetes-the-hard-way-master.epub"
          checksum="$epub.sha256"
          provenance="$epub.provenance.json"
          commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_commit"])' "$provenance")"
          notes="Unofficial, noncommercial reading-format adaptation built from upstream master. Source commit: $commit. Provided free of charge under CC BY-NC-SA 4.0. Not affiliated with, sponsored by, or endorsed by The Linux Foundation, CNCF, the Kubernetes project, or Kelsey Hightower. Kubernetes® is a registered trademark of The Linux Foundation in the United States and other countries. The cover artwork is AI-generated; its stylized Kubernetes helm mark is used for this noncommercial educational publication and makes no certification claim. Trademark guidance: $TRADEMARK_URL"
          if gh release view epub-master >/dev/null 2>&1; then
            gh release upload epub-master "$epub" "$checksum" "$provenance" --clobber
            gh release edit epub-master \
              --title "Kubernetes The Hard Way — Unofficial EPUB from master" \
              --notes "$notes" --latest
          else
            gh release create epub-master "$epub" "$checksum" "$provenance" \
              --title "Kubernetes The Hard Way — Unofficial EPUB from master" \
              --notes "$notes" --latest
          fi
