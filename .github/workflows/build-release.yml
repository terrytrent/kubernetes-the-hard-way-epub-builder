name: Build EPUB release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      source_tag:
        description: Upstream tag to build; blank selects the newest tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: epub-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has_tags: ${{ steps.missing.outputs.has_tags }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Fetch upstream tags
        run: make fetch

      - name: Find every unpublished upstream tag
        id: missing
        env:
          REQUESTED_TAG: ${{ inputs.source_tag }}
        run: |
          mkdir -p build
          : > build/missing-tags.txt
          if test -n "$REQUESTED_TAG"; then
            candidates="$REQUESTED_TAG"
          else
            candidates="$(git -C build/upstream tag --sort=version:refname)"
          fi
          for tag in $candidates; do
            case "$tag" in
              *[!0-9A-Za-z._-]*) echo "Unsupported tag characters: $tag" >&2; exit 1 ;;
            esac
            git -C build/upstream rev-parse --verify "refs/tags/$tag^{commit}"
            if ! gh release view "epub-$tag" >/dev/null 2>&1; then
              echo "$tag" >> build/missing-tags.txt
            fi
          done
          if test -s build/missing-tags.txt; then
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned, hash-verified tools
        if: steps.missing.outputs.has_tags == 'true'
        run: |
          make dependencies
          ./scripts/install_epubcheck.sh

      - name: Build and validate every missing release
        if: steps.missing.outputs.has_tags == 'true'
        run: |
          while IFS= read -r tag; do
            make checksum SOURCE_REF="$tag"
          done < build/missing-tags.txt
          cp build/missing-tags.txt dist/missing-tags.txt

      - name: Upload verified release candidates
        if: steps.missing.outputs.has_tags == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-epub-releases
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    if: needs.build.outputs.has_tags == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download verified release candidates
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: verified-epub-releases
          path: dist

      - name: Verify transferred artifacts
        run: |
          while IFS= read -r tag; do
            epub="dist/kubernetes-the-hard-way-$tag.epub"
            python3 scripts/verify_provenance.py \
              "$epub" "$epub.provenance.json" "$epub.sha256" --tag "$tag"
          done < dist/missing-tags.txt

      - name: Attest EPUB provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*.epub

      - name: Publish verified artifacts
        env:
          TRADEMARK_URL: https://www.linuxfoundation.org/legal/tm-usage
        run: |
          cd dist
          while IFS= read -r tag; do
            epub="kubernetes-the-hard-way-$tag.epub"
            checksum="$epub.sha256"
            provenance="$epub.provenance.json"
            commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_commit"])' "$provenance")"
            gh release create "epub-$tag" "$epub" "$checksum" "$provenance" \
              --title "Kubernetes The Hard Way — Unofficial EPUB $tag" \
              --notes "Unofficial, noncommercial reading-format adaptation built from upstream tag $tag at commit $commit. Provided free of charge under CC BY-NC-SA 4.0. Not affiliated with, sponsored by, or endorsed by The Linux Foundation, CNCF, the Kubernetes project, or Kelsey Hightower. Kubernetes® is a registered trademark of The Linux Foundation in the United States and other countries. The cover artwork is AI-generated; its stylized Kubernetes helm mark is used for this noncommercial educational publication and makes no certification claim. Trademark guidance: $TRADEMARK_URL"
          done < missing-tags.txt
