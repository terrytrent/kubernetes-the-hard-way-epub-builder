name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run unit and security tests
        run: |
          make quality
          make test

      - name: Fetch upstream default branch
        run: make fetch

      - name: Install pinned, hash-verified tools
        run: |
          make dependencies
          ./scripts/install_epubcheck.sh

      - name: Build and validate upstream master
        run: make checksum
